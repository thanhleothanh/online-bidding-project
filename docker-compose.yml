services:
  mysql:
    image: mysql:8
    container_name: online-bidding-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: onlineBiddingProject
      MYSQL_USER: thanh
      MYSQL_PASSWORD: Abc@12345
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/onlineBiddingProject.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: online-bidding-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/onlineBiddingProject
      DB_USERNAME: thanh
      DB_PASSWORD: Abc@12345
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
